# 内容包 —— 内容数据（对应模型 Control.Agent.Content.ContentPack）
#
# 包 = 可复用的**单元组合**：把“常一起出现”的单元收成一块积木，模板由若干包**叠加**而成。
# 为什么不用「模板继承」：机器类别之间是**交叉**关系（LinuxCompute 与 LinuxData 各有专有面，
# 谁也不含谁），把内容集合的并集错记成继承链，只会一边用 base、一边抄清单，基线一改就漂移。
# 组合则各包独立版本化，模板只声明“选哪几块”。
#
# kind = Baseline：该平台所有类别都采的公共集（每平台恰好一个）；
# kind = Feature ：按类别叠加的专有集。
# 包**不带门**：事实门（什么条件才采）在单元的 `match` 上，一门在一处生效。
# families 是覆盖的采集面（= unit_refs 对应面的并集），供审计与覆盖度清点。
#
# 状态：包 status 是**策展成熟度**（人定），不是闸门；闸门看单元的采集就绪度（见 catalog.toml）。

# ── macOS ─────────────────────────────────────────────────────────

[[pack]]
pack_id = "macos-base"
platform = "macos"
kind = "Baseline"
families = [
  "LoginSession",
  "SoftwareChange",
  "CrashPanic",
  "NetworkFirewall",
  "PrivacyTcc",
  "GatekeeperQuarantine",
  "ServiceLifecycle",
  "RebootPower",
  "MiscSystem",
  "HostMetrics",
]
unit_refs = [
  "mac-login-session",
  "mac-software-change",
  "mac-crash-panic",
  "mac-network-wifi",
  "mac-privacy-tcc",
  "mac-gatekeeper",
  "mac-launchd-service",
  "mac-reboot-power",
  "mac-misc-system",
  "mac-host-metrics",
]
catalog_version = 15
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"

[[pack]]
pack_id = "macos-dev"
platform = "macos"
kind = "Feature"
# 开发机专有：提权执行、开发工具链，以及**本地数据库与存储健康**
# （只有 MacDev 有这些——MacDaily 个人机不装库、也不跑 smartctl）。
families = ["PrivilegeExecution", "DevToolchain", "DatabaseService", "StorageHealth"]
unit_refs = [
  "mac-privilege-exec",
  "mac-dev-toolchain",
  "mac-db-service",
  "mac-storage-health",
]
catalog_version = 15
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"

# ── Linux ─────────────────────────────────────────────────────────

[[pack]]
pack_id = "linux-base"
platform = "linux"
kind = "Baseline"
families = [
  "LoginSession",
  "PrivilegeExecution",
  "SoftwareChange",
  "ServiceLifecycle",
  "CrashPanic",
  "NetworkFirewall",
  "RebootPower",
  "KernelSystem",
  "StorageHealth",
  "HostMetrics",
  "ContainerWorkload",
]
unit_refs = [
  "linux-auth-session",
  "linux-sudo-log",
  "linux-audit-log",
  "linux-software-change",
  "linux-service-lifecycle",
  "linux-crash-panic",
  "linux-network-firewall",
  "linux-reboot-power",
  "linux-kernel-system",
  "linux-storage-health",
  "linux-host-metrics",
  # 容器 stdout 是**主机普遍能力**（有 docker / kubelet 就有），不按机器用途分发：
  # 放进基线包，LinuxHost 也能拿到这个面（以前挂在 Feature 包上，纯 Docker 业务机拿不到）。
  "linux-container-stdout",
  "linux-docker-container-stdout",
]
catalog_version = 15
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"

# 作业/调度/加速卡：由单元的 `match` 做事实门（`installed:slurm|kubelet`）。
# 容器面**不在这里**了：它已独立成 `ContainerWorkload` 并挂在 `linux-base`（见上）。
# `linux-workload` 本身不设门，门在单元上（`pack` 不带条件）。
[[pack]]
pack_id = "linux-workload"
platform = "linux"
kind = "Feature"
families = ["ComputeWorkload"]
unit_refs = [
  "linux-compute-workload",
]
catalog_version = 15
status = "draft"
curated_by = "platform-maintenance"
curated_at = "2026-09-22T00:00:00Z"


name: Release

# 打 tag 即发制品（三通道：`vX.Y.Z-alpha` / `vX.Y.Z-beta` / `vX.Y.Z`）。
# 版本取自 tag 名（去 `v`），**核心版本**要与 `version.txt` 核对 —— 不一致直接失败（见 scripts/package.sh）。
# alpha / beta 标为 prerelease；stable 才是正式版。
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Channel vs branch（强校验）
        # 通道约定：-alpha 从 alpha 分支、-beta 从 beta、stable 从 main。
        # 不一致**直接失败** —— 通道后缀是「未验收」的信号，发错分支等于把 alpha 内容标成 stable。
        # 例外（补发/仓刚建）：仓库变量 `ALLOW_CHANNEL_MISMATCH=true` 时降级为警告，以便留痕。
        env:
          ALLOW_CHANNEL_MISMATCH: ${{ vars.ALLOW_CHANNEL_MISMATCH }}
        run: |
          set -eu
          case "${GITHUB_REF_NAME}" in
            *-alpha) expected=alpha ;;
            *-beta) expected=beta ;;
            *) expected=main ;;
          esac
          if git fetch --quiet origin "+refs/heads/*:refs/remotes/origin/*" 2>/dev/null \
            && git branch -r --contains "${GITHUB_SHA}" | grep -q "origin/${expected}$"; then
            echo "tag ${GITHUB_REF_NAME} 来自 ${expected} 分支"
            exit 0
          fi
          if [ "${ALLOW_CHANNEL_MISMATCH:-false}" = "true" ]; then
            echo "::warning::tag ${GITHUB_REF_NAME} 的提交不在 origin/${expected} 上（ALLOW_CHANNEL_MISMATCH=true，放行）"
            exit 0
          fi
          echo "::error::tag ${GITHUB_REF_NAME} 必须打在 origin/${expected} 上（通道与分支不一致；tag 分支 ${GITHUB_REF}）"
          exit 1

      - name: Package knowledge
        env:
          # 发布侧私钥（只在 CI secret 里）。没配就产出**未签名**包 —— 配了验签公钥的网关会拒收。
          KNOWLEDGE_SIGNING_KEY_PEM: ${{ secrets.KNOWLEDGE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -n "${KNOWLEDGE_SIGNING_KEY_PEM}" ]; then
            printf '%s\n' "${KNOWLEDGE_SIGNING_KEY_PEM}" > "${RUNNER_TEMP}/knowledge-signing.pkcs8.pem"
            export KNOWLEDGE_SIGNING_KEY="${RUNNER_TEMP}/knowledge-signing.pkcs8.pem"
          else
            echo "::warning::KNOWLEDGE_SIGNING_KEY 未配置 —— 本次发布的包**没有签名**"
          fi
          ./scripts/package.sh --version "${GITHUB_REF_NAME#v}" --out dist

      - name: Content version monotonic（改了内容必须升版本）
        # 「改了目录却忘了升 `catalog_version`」在本仓最容易发生：包能打出来、网关也能装，
        # 没有任何一步会拦。但下游按 `catalog_version` 判新旧 / 判回滚 / 锁 `StandingWork` ——
        # 版本不动等于两份不同内容共用一个版本号，回滚会回错东西。
        # 上一版拿不到（首个发布 / 网络失败）时只告警，不阻塞。
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          new_pkg="$(ls dist/*.tar.gz | head -1)"
          new_manifest="${RUNNER_TEMP}/manifest-new.json"
          # GNU tar 不认通配符参数除非给 `--wildcards`；bsdtar（macOS）反过来不认这个选项。
          # 两种都支持：先试 GNU 写法，失败再退到 bsdtar 写法。
          extract_manifest() {
            if tar -xzOf "$1" --wildcards '*/manifest.json' 2>/dev/null; then
              return 0
            fi
            tar -xzOf "$1" '*/manifest.json'
          }
          extract_manifest "${new_pkg}" > "${new_manifest}"

          prev_tag="$(gh release list --exclude-drafts --limit 30 --json tagName \
            --jq "[.[] | select(.tagName != \"${TAG}\")][0].tagName")"
          case "${prev_tag}" in
            '' | null)
              echo "::warning::找不到上一版 release，跳过内容版本单调性校验"
              exit 0
              ;;
          esac

          prev_dir="$(mktemp -d)"
          if ! gh release download "${prev_tag}" --pattern '*.tar.gz' --dir "${prev_dir}" --clobber >/dev/null 2>&1; then
            echo "::warning::下载上一版 ${prev_tag} 失败，跳过内容版本单调性校验"
            exit 0
          fi
          prev_pkg="$(ls "${prev_dir}"/*.tar.gz | head -1)"
          prev_manifest="${RUNNER_TEMP}/manifest-prev.json"
          extract_manifest "${prev_pkg}" > "${prev_manifest}"

          python3 scripts/check_content_versions.py \
            "${prev_manifest}" "${new_manifest}" "${prev_tag}" "${TAG}"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-knowledge-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wist-knowledge-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # alpha / beta 是预发布（不占 “latest”）；只有 stable 才是正式版。
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          generate_release_notes: true
          files: dist/*

  # 可选：把本仓制品推到腾讯云 COS（对象存储），供中心 / CDN / 客户端按稳定 URL 拉取。
  # 未配置 Variables（COS_BUCKET 为空）时整段自动跳过，不会让发布失败；
  # 一旦设置 COS_BUCKET 即视为启用，此时密钥缺失会直接报错（便于发现漏配）。
  # 注意：`secrets` 上下文不能出现在 step 级 if 里，故启用判定放在 job 级（只看 vars）。
  #   Variables：COS_BUCKET（含 -APPID）、COS_REGION（如 ap-guangzhou）、可选 COS_PREFIX（默认取仓库名）
  #   Secrets：  COS_SECRET_ID、COS_SECRET_KEY（临时密钥再加 COS_SESSION_TOKEN）
  # 对象键：<COS_PREFIX>/<tag>/<文件名>（预发布与正式版同样）+ <COS_PREFIX>/latest/<文件名>（**仅 stable**）。
  # 每个对象带自定义元数据 x-cos-meta-artifact-sha256=<hex>（COS 只存 MD5 ETag，sha256 得自带）。
  upload-cos:
    name: Upload artifacts to Tencent COS
    needs: [release]
    runs-on: ubuntu-24.04
    if: ${{ vars.COS_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true

      - name: Install coscli
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Upload to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 去掉密钥里的空白字符：粘贴常带入尾随换行/空格，会让签名报 SecretKey is invalid。
          secret_id="$(printf '%s' "${COS_SECRET_ID}" | tr -d '[:space:]')"
          secret_key="$(printf '%s' "${COS_SECRET_KEY}" | tr -d '[:space:]')"
          session_token="$(printf '%s' "${COS_SESSION_TOKEN}" | tr -d '[:space:]')"
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${secret_id}"
              secretkey: "${secret_key}"
              sessiontoken: "${session_token}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF
          prefix="${COS_PREFIX:-${GITHUB_REPOSITORY##*/}}"
          prefix="${prefix%/}"
          cfg="$HOME/.cos.yaml"
          out="$PWD/coscli_output"
          rm -rf "${out}"
          # coscli 只打印汇总，失败明细落在 coscli_output/<时间>/ 下；失败时打印并输出为 annotation。
          dump_err() {
            echo "::error::$1"
            if [ -d "${out}" ]; then
              find "${out}" -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              detail="$(find "${out}" -type f -exec cat {} \; | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=coscli 明细::$1 —— ${detail}"
            fi
            exit 1
          }
          shopt -s nullglob
          files=(pkg/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::pkg/ 下没有制品可上传"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "${f}" ] || continue
            name="$(basename "${f}")"
            # COS 对象只存 MD5（ETag），GitHub 侧资产 digest（sha256）过不来。把 sha256 作为
            # **对象自定义元数据**写进对象本身（x-cos-meta-artifact-sha256 —— 与设计里的
            # artifact_sha256 字段同名）—— 随对象走，录 COS 地址时可用 `coscli stat`（HEAD）
            # 读回填 expected_sha256（`ls` 不返回自定义元数据）。--meta 形如 key:value（多个用 # 分隔）。
            # 本 step 只有 `set -eu`（无 pipefail），管道失败会被 cut 吃掉；空摘要等于又「丢」了，
            # 故显式兜一道。
            sha="$(sha256sum "${f}" | cut -d' ' -f1)"
            [ -n "${sha}" ] || { echo "::error::无法计算 ${name} 的 sha256" >&2; exit 1; }
            meta="x-cos-meta-artifact-sha256:${sha}"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/${TAG}/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（${TAG}）"
            # `latest/` 只给 stable 移动：否则一个 alpha 会把“最新”指到通道版，
            # 按 latest 拉的网关/脚本就会静默跳通道。
            case "${TAG}" in
              *-alpha | *-beta)
                echo "预发布 ${TAG}：不移动 latest/"
                ;;
              *)
                coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/latest/${name}" -c "${cfg}" --meta "${meta}" \
                  || dump_err "上传 ${name} 失败（latest）"
                ;;
            esac
            echo "已上传 ${name}  sha256=${sha}"
          done
          echo "COS 上传完成。"
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}" \
            || echo "::warning::COS 列表失败（可能缺 cos:GetBucket 权限）；上传本身已成功。"

[[units]]
unit_id = "linux-host-metrics"
family = "HostMetrics"
capability = "collect_metrics"
platform = "linux"
match = ""
# 与 `mac-host-metrics` 同一口径：指标帧由平台无关的 `agent_uplink` 包（`metrics_frame` 规则）承接
# （数据面那个 OML 名字带 `macos_` 只是历史命名）；指标读 /proc、/sys，不需要提权。

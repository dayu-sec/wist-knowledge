[[units]]
unit_id = "linux-container-stdout"
family = "ComputeWorkload"
capability = "collect_logs"
platform = "linux"
# 有容器日志 symlink 目录才有这个面（kubelet 建 `/var/log/containers`；纯 Docker 主机没有）。
# 用 path_exists 而不是 `installed:kubelet`：判的是“日志在不在”，不是“装了什么”。
match = "path_exists:/var/log/containers"
rule_ref = ""
requires_privilege = "root"
# 采集就绪：W1 的文件族 glob + W2 的结构化选源（`filters`）。
#
# 为什么只有**一个**单元：13 business / 15 gateway / 16 k8s_pod 是同一批容器 stdout 的
# 三种页面归类（D8），拆成两条 active 单元会重复采同一批文件（G5）。
# 归类在数据面做：`source_type=container_stdout`，`log_type` 按正文分派
# （gateway > business > k8s_pod）。
#
# `filters` 默认留空 = 全采：namespace 白名单是**部署结论**，平台基线替客户圈定范围只会
# 悄悄少采。需要收窄时改这一条来源的 `filters = { namespace_in = [...] }` /
# `pod_not_in = [...]`（值必须是精确名字）；带 filters 的单元要求 agentd 声明对应能力
# （`filters:namespace_in` / `filters:pod_not_in`），旧 agent 上由网关在派活时裁掉这条来源。
status = "active"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/containers/*.log"

[[units]]
unit_id = "linux-docker-container-stdout"
family = "ComputeWorkload"
capability = "collect_logs"
platform = "linux"
# 纯 Docker 主机（没有 kubelet）：容器日志在 `<docker-root>/containers/<id>/<id>-json.log`，
# 默认 `/var/lib/docker`。与上面的 k8s 单元是**两个载体、同一批语义**（13/15/16）：
# 读法相同（`none`：一行一条），区别只在路径与文件格式的解释位置。
# 用 path_exists 而不是 `installed:docker`：判的是"日志在不在"，不是"装了什么"。
#
# ⚠ **k8s + cri-dockerd** 的主机上两个单元会同时命中（kubelet 把 pod 日志路径指向 docker 的
#   json 文件）→ 同一份日志被采两遍。`not_path_exists:` 条件落地前，这类集群先别把机器
#   纳入本面（见 docker-container-logs.md §5.5）。
match = "path_exists:/var/lib/docker/containers"
rule_ref = ""
requires_privilege = "root"
# 采集就绪：**正文原样**，不在这里解 docker 的 JSON 信封 —— 解码归数据面（与 CRI 头同一层，
# 见 `docker-container-logs.md` §5.1）。所以本单元不需要新读法、也不需要新能力轴：
# 老 agentd 照样能执行（它只需要把字节搬回来）。
# 容器身份（name / image / id）要等帧字段落地；在那之前只能靠 `source_path` 里的 id 回查。
status = "active"

[[units.sources]]
kind = "FileGlob"
# `*-json.log*` 覆盖 docker 自己的轮转产物（设了 `max-size` 时会转成 `-json.log.1`）。
# 多层 glob（容器 id 是目录名）读取器本来就支持：按固定前缀逐层 `read_dir`。
target = "/var/lib/docker/containers/*/*-json.log*"


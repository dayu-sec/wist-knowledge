[[units]]
unit_id = "linux-kernel-system"
family = "KernelSystem"
capability = "collect_logs"
platform = "linux"
match = "path_exists:/run/systemd/journal"
rule_ref = ""
requires_privilege = "root"
# 采集就绪（W3）：内核日志**只从 journald 取**（`journalctl -k -p 4 -o json` + 游标续读）。
# 为什么删掉 kern.log / messages：它们是 rsyslog 的派生副本（PRIORITY、_TRANSPORT 都没有，
# 保留期也和 journal 不同步），两个源并存只会重复 + 漂移，不存在稳定的“优先”中间态。
# 非 systemd 主机：`/run/systemd/journal` 不存在 → 该面不展开（不做文件回退，见 D6）。
status = "active"

[[units.sources]]
kind = "Exporter"
target = "journalctl-kernel"

[[units]]
unit_id = "linux-db-service"
family = "DatabaseService"
capability = "collect_logs"
platform = "linux"
match = "path_exists:/var/log/postgresql|/var/log/mysql|/var/log/redis|/var/log/mongodb"
rule_ref = ""
requires_privilege = "root"
# 采集就绪（W4）：两种记录边界都是**日志格式固有的**，不是偏好 ——
#   * Postgres csvlog：字段（如 message）会把换行写进引号里，按行切会把一条 SQL 错误
#     拆成几条不完整的记录；`postgres_csv` 只在引号外的换行切。
#   * MySQL slow log：一条慢查询横跨多行，靠 `# Time:` 起块；按行切会把一条记录拆散。
#
# 为什么要用 `path_exists` 而不是 `installed:postgresql|mysql|...` 做门：
#   包清单探针还没实现（agentd backlog B119，`packages` 恒空），`installed:` 恒为
#   “无法判定” → 这个面永远展不开（能授权、但一授权就 409）。日志目录是真实已知的。
#
# 只收 `.csv` / `*slow*.log`：旧写法 `/var/log/postgresql/*`、`/var/log/mysql/*` 会与它们重叠
# （同一文件被两条来源各读一遍 → 重复采集，G5）。没有匹配不算失败，所以没开 csvlog /
# slow log 的机器不会每轮报错。
status = "active"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/postgresql/*.csv"
multiline = "postgres_csv"

[[units.sources]]
kind = "FileGlob"
# slow log 的文件名由 `slow_query_log_file` 决定（`slow.log` / `mysql-slow.log` 都见过）。
target = "/var/log/mysql/*slow*.log"
multiline = "mysql_slow"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/redis/*.log"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/mongodb/*.log"


# ── Linux ─────────────────────────────────────────────────────────

[[units]]
unit_id = "linux-auth-session"
family = "LoginSession"
capability = "collect_logs"
platform = "linux"
# 两条路径是二选一：哪个存在采哪个。门控防「两个都不存在时还派一份空活」。
# 不存在的单条来源由网关派活时按探测事实裁掉（见 work.rs::materialize_spec）。
match = "path_exists:/var/log/auth.log|/var/log/secure"
rule_ref = ""
requires_privilege = "root"
# 采集就绪：auth.log（Debian 系）/ secure（RHEL 系）是**显式路径**，agentd 今天就能 tail。
# 原第三条 `wtmp` 已删 —— 它是 utmp **二进制**记录、不是文本日志，tail 它只会出乱码。
status = "active"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/auth.log"
# W4：噪音行（整条命中就丢）——每分钟一条、信息量为零的会话噪音。
# 只做子串（不是正则）；丢弃数进 agentd 自观测（`telemetry noise dropped …`）。
# 带这个字段要求 agentd 支持 `drop_if_contains:substring`，旧 agent 上由网关裁掉该来源。
drop_if_contains = [
  "pam_unix(cron:session)",
  "systemd-logind",
  "pam_unix(systemd-user:session)",
]

[[units.sources]]
kind = "FileGlob"
target = "/var/log/secure"
drop_if_contains = [
  "pam_unix(cron:session)",
  "systemd-logind",
  "pam_unix(systemd-user:session)",
]

[[units]]
unit_id = "linux-sudo-log"
family = "PrivilegeExecution"
capability = "collect_logs"
platform = "linux"
# sudo 触发行同时落在 secure/auth.log（由 linux-auth-session 采），这里只收命令级审计。
# 文件门控：RHEL 系默认有 sudo.log，Debian 系需要 sudoers 里配 `logfile` ——
# 没有这个文件就不派，避免对一个不存在的路径空转（也避免“已授权却什么都没采到”）。
match = "path_exists:/var/log/sudo.log"
rule_ref = ""
requires_privilege = "root"
status = "active"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/sudo.log"

[[units]]
unit_id = "linux-audit-log"
family = "PrivilegeExecution"
capability = "collect_logs"
platform = "linux"
# 整文件跟尾：**不按 type= 丢行**（无专用规则的 type= 也要出，解析交给数据面）。
# 8 个 host_audit_* 由数据面按 type= 分派；这里不拆单元 —— 同一文件拆多个单元会重复读。
match = "path_exists:/var/log/audit/audit.log"
rule_ref = ""
requires_privilege = "root"
status = "active"

[[units.sources]]
kind = "FileGlob"
target = "/var/log/audit/audit.log"


# 采集目录 v1 —— 内容数据（对应模型 Control.Agent.Content.CollectionCatalog）
#
# 字段约定（loader 尚未实现，此处先固定**结构**，便于评审与校验）：
#   sources：采集来源列表（结构化的 kind + target，**替代原先自由文本的 spec_fragment**）：
#     kind = FileGlob            可直接 tail 的路径 / 通配
#            Exporter            需周期导出器（二进制、DB、统一日志、审计链、dmesg，不能直接 tail）
#            UnifiedLogPredicate 统一日志 predicate
#            MetricInterval      指标采集间隔
#     multiline = none           一行一条（默认）
#                 indented       行首缩进/制表符是上一条的续行（拟一整个多行记录上送）
#     一个单元可有多来源；`glob:A|B` 这种在一个串里塞多路径的写法已拆成多条来源。
#   match：装了什么 / 跑了什么 / **哪个路径在不在**才采；空 = 平台基线必采（三态求值，
#          「没探测过」≠「不存在」，见模型 CollectionUnit.match）。
#          可用 kind：installed | port | path_exists（**绝对路径**；agentd 按网关下发的
#          白名单实探，探测范围由本文件的 path_exists 条件推导）。
#   rule_ref：数据面 rule/oml 标识 —— **解析就绪度**：非空 = 有规则，采下来的记录能被归类、
#            抽字段；空 = 只落原文（帧照进、记录照落，只是都归在泛化的 agent.log 下）。
#            **它不是采集闸门** —— 采原文不需要任何规则，规则是数据面的事。
#   requires_privilege：none | root | fda
#   status：**采集就绪度** —— active（可以派下去采：有来源，且至少一条来源 agentd 真能执行）
#           | draft（面已定，但还没到能采）| deprecated
#
# 现状（macOS）：5 个面可采（active）—— mac-software-change、mac-reboot-power、
#   mac-network-wifi、mac-launchd-service、mac-host-metrics。
# 现状（Linux）：10 个面可采 —— 按面分：
#   LoginSession / PrivilegeExecution / SoftwareChange（`auth.log`/`secure`、`sudo.log`、
#   `audit.log` 整文件跟尾、`dpkg.log`/`apt`/`dnf`/`yum`）、
#   ServiceLifecycle / CrashPanic / NetworkFirewall / RebootPower / KernelSystem / StorageHealth
#   （`journalctl-*`、`dmesg`、`nft`/`iptables-save`、`last`、`smartctl` 等导出器；
#   CrashPanic 与 StorageHealth 另有 coredump / fsck 通配）、HostMetrics（指标）。
#   **内核日志（KernelSystem）从 W3 起只走 journald**（`Exporter journalctl-kernel`，
#   `journalctl -k -p 4 -o json` + 游标）：文件来源（`kern.log` / `messages`）是 rsyslog 的
#   派生副本，PRIORITY/_TRANSPORT 都会丢，且和 journal 的保留期不同步 —— 两个源并存必然重复。
#   非 systemd 主机上该面不展开（`path_exists:/run/systemd/journal`），**不做文件回退**（D6）。
#   audit.log 是整文件跟尾：**不按 type= 丢行**，8 个 host_audit_* 由数据面按 type= 分派。
#   判据（W1 起）：`FileGlob` 的目标是**绝对路径** —— 显式单文件，或**单层 glob/目录**
#   （`*` 不跨目录，`**` 不支持）—— 或 `MetricInterval`；`Exporter` 用**已知导出器 ID**
#   （见 `wist-contracts::work::EXPORTER_IDS`）。`~` 与相对路径永远不可执行。
#
# 单层 glob **已可执行**，但不要因此把靠通配的单元直接翻 active：机队里仍有不认识 glob 的
# 旧 agentd（它们会如实报 unsupported）。按 `linux-server-log-coverage-plan.md` D7 的发布纪律，
# 先让机队升级并验证，再单独发一版目录翻 active。
#
# **单文件轮转的不要用通配写**（`wifi.log*` 是错写法）：通配会把轮转产物（`wifi.log.0`、
#   `wifi.log.*.bz2`）也纳入匹配集。正确写法是显式写当前那个文件（`/var/log/wifi.log`）：
#   轮转由采集器按 **inode** 跟踪 —— 文件被改名后只把尾巴读完，再跟到新文件；
#   “轮转产物不当独立对象采”因此自动成立，也不靠任何后缀过滤规则。
#   目录型/文件族的来源确实需要通配时，用 `exclude_globs`（绝对路径 glob，按**展开后的完整
#   路径**匹配）把归档产物（如 `*.gz`）剔掉。
#
# 仍需新能力才能采的面（都不是“缺解析规则”）：
#   ① **事件型**（每个文件 = 一条独立事件，如 `*.ips`）：W1 已能展开 glob，且“运行中新发现的
#      文件从头读”（glossary §9.12 `discovered_file_position`）也随 W1 落地；
#   ② **目录型**（目录下多个各自独立的文件、各自还轮转，如 `cups/*` / `apache2/*` /
#      `~/Library/Logs/Homebrew/*`）：W1 的目录目标 + `exclude_globs` 已能表达（`~/...` 仍需
#      改写成绝对路径）；
#   ③ **来源类型未实现**（UnifiedLogPredicate）。
#
# 采集就绪（能不能派下去把原文拿回来）与解析就绪（rule_ref）是**两个轴**，不互相卡：
#   mac-reboot-power 就是“可采但解析未就绪”的样本（原文进得来，只会归在泛化的 agent.log 下）。

catalog_version = 9
origin = "Gateway"
published_at = "2026-10-23T00:00:00Z"

# ── 采集面词表 ────────────────────────────────────────────────────
#
# 这是**运行期词表的唯一来源**（网关从包里装载，见
# `doc/design/center/collection-family-capability-contract.md` §5.5）。
#
# 规矩（机器会验）：
#   1. **只增不改名**：`id` 进数据帧、接口与历史数据，改名就是破坏性变更；
#      改名 = 新建一个面 + 旧面保留（要改语义请提高 `semantics_version` 或新建面）。
#   2. 网关激活时会做**追加式校验**：删掉已生效的面会被拒（`vocabulary_not_append_only`）。
#   3. `platforms` 决定面与平台的对应；留空 = 全平台。
#   4. `name_*` / `summary_*` 是**展示文案**（可自由改，不发版），`id` 不翻译。
#   5. 与模型 `families.mju` 的一致性由 CI 校验。

